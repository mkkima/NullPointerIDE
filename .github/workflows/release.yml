name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nullpointer-release-main
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows update
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

      - name: Verify Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate automatic release version
        shell: pwsh
        run: |
          $version = "0.${{ github.run_number }}.${{ github.run_attempt }}"
          node scripts/set-release-version.mjs $version
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: app-v__VERSION__
          releaseName: NullPointer v__VERSION__
          releaseBody: |
            Automatic build from `${{ github.sha }}`.
            Includes a Windows x64 installer, Windows portable ZIP, and macOS Apple Silicon DMG.
            Installed and portable Windows copies of NullPointer receive signed updates automatically.
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ github.sha }}
          updaterJsonPreferNsis: true

      - name: Package portable Windows build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $binary = Resolve-Path "src-tauri\target\release\nullpointer-ide.exe"
          $package = Join-Path $env:RUNNER_TEMP "NullPointer-Portable"
          $archive = Join-Path $env:RUNNER_TEMP "NullPointer_${env:APP_VERSION}_windows_x64_portable.zip"
          $portableBinary = Join-Path $env:RUNNER_TEMP "NullPointer_${env:APP_VERSION}_windows_x64_portable.exe"
          $portableManifest = Join-Path $env:RUNNER_TEMP "portable-latest.json"

          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination $portableBinary
          Copy-Item -LiteralPath $portableBinary -Destination (Join-Path $package "NullPointer.exe")
          Copy-Item -LiteralPath "packaging\portable\portable.flag" -Destination $package
          Copy-Item -LiteralPath "packaging\portable\README.txt" -Destination $package
          Compress-Archive -LiteralPath $package -DestinationPath $archive -CompressionLevel Optimal

          npx tauri signer sign $portableBinary
          $signaturePath = "$portableBinary.sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "The portable executable signature was not created."
          }
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "The portable executable signature is empty."
          }

          $assetName = Split-Path -Leaf $portableBinary
          $manifest = [ordered]@{
            version = $env:APP_VERSION
            notes = "Automatic portable build from ${{ github.sha }}."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/mkkima/NullPointerIDE/releases/download/app-v$env:APP_VERSION/$assetName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $portableManifest -Encoding utf8 -NoNewline

          "PORTABLE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "PORTABLE_BINARY=$portableBinary" >> $env:GITHUB_ENV
          "PORTABLE_SIGNATURE=$signaturePath" >> $env:GITHUB_ENV
          "PORTABLE_MANIFEST=$portableManifest" >> $env:GITHUB_ENV

      - name: Publish portable Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "app-v$env:APP_VERSION" `
            "$env:PORTABLE_ARCHIVE#NullPointer Portable for Windows x64" `
            "$env:PORTABLE_BINARY#Signed NullPointer portable executable for automatic updates" `
            "$env:PORTABLE_SIGNATURE#Portable executable signature" `
            "$env:PORTABLE_MANIFEST#Portable automatic update manifest" `
            --clobber

  release-macos:
    name: Build and publish macOS Apple Silicon update
    needs: release-windows
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust for Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate automatic release version
        run: |
          version="0.${{ github.run_number }}.${{ github.run_attempt }}"
          node scripts/set-release-version.mjs "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, ad-hoc sign and publish Apple Silicon release
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: "-"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: app-v__VERSION__
          releaseName: NullPointer v__VERSION__
          releaseBody: |
            Automatic build from `${{ github.sha }}`.
            Includes a Windows x64 installer, Windows portable ZIP, and macOS Apple Silicon DMG.
            Installed and portable Windows copies of NullPointer receive signed updates automatically.
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ github.sha }}
          args: --target aarch64-apple-darwin --bundles app,dmg
          updaterJsonPreferNsis: true
